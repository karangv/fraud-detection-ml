data:
  # Downloaded with kagglehub if this file doesn't exist.
  path: data/creditcard.csv
  kaggle_dataset: mlg-ulb/creditcardfraud

seed: 42
artifact_dir: artifacts

split:
  train: 0.6
  val: 0.2
  test: 0.2

cv:
  folds: 5
  n_jobs: -1

selection:
  metric: pr_auc # or recall_at_precision
  min_precision: 0.70 # only used by recall_at_precision

smote_k_neighbors: 5

xgb_params:
  n_estimators: 250
  objective: binary:logistic
  subsample: 0.85
  colsample_bytree: 0.85
  reg_alpha: 0.02
  reg_lambda: 0.6
  min_child_weight: 1
  eval_metric: aucpr
  # cv.n_jobs does the parallel work. One thread per fit also keeps runs repeatable.
  n_jobs: 1

param_grid:
  scale_pos_weight: [3.0, 4.0, 5.0, 6.0, 7.0, 8.0]
  max_depth: [6, 7, 8]
  learning_rate: [0.08, 0.1, 0.12]

threshold_strategy: cost # or f1

costs:
  fn: 100
  fp: 10
  tp: -1
  tn: 0
